name: Deploy DEV Frontend Exam

on:
  push:
    branches: [develop]
    paths:
      - "frontend-exam/**"
  workflow_dispatch:

jobs:
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend exam image
        env:
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "${GH_OWNER:-Danimarqz}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER}/frontend-exam
          docker buildx build \
            --platform linux/amd64 \
            -f frontend-exam/Dockerfile \
            -t ${IMAGE}:devlatest \
            -t ${IMAGE}:${{ github.sha }} \
            frontend-exam \
            --push
