name: Deploy Frontend Exam

on:
  push:
    branches: [main]
    paths:
      - "frontend-exam/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-exam/package-lock.json

      - name: Crear .env frontend
        working-directory: frontend-exam
        run: |
          cat <<'EOF' > .env
          ${{ secrets.FRONTEND_ENV }}
          EOF

      - name: Install dependencies
        working-directory: frontend-exam
        run: npm ci

      - name: Build Astro app
        working-directory: frontend-exam
        run: npm run build

      - name: Listar dist generado
        run: ls -R frontend-exam/dist/

      - name: Deploy dist to server
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -az --delete
          path: frontend-exam/dist/
          remote_path: htdocs/simulador/dist/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Sync package metadata (optional)
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -az
          path: frontend-exam/package*.json
          remote_path: htdocs/simulador/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Install production dependencies on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/htdocs/simulador
            npm install --production
            sudo systemctl restart frontend-exam
