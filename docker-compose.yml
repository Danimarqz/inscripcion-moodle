services:
  backend:
    image: ghcr.io/danimarqz/backend-moodle:latest
    pull_policy: always
    container_name: backend-moodle
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - backend_pdfs:/app/generated_pdfs
    ports:
      - "8000:8000"
    networks:
      - internal
      - nginx_proxy

  frontend-exam:
    image: ghcr.io/danimarqz/frontend-exam:latest
    pull_policy: always
    container_name: frontend-exam-moodle
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4321:4321"
    networks:
      - internal
      - nginx_proxy

networks:
  internal:
    driver: bridge
  nginx_proxy:
    external: true

volumes:
  backend_pdfs:
